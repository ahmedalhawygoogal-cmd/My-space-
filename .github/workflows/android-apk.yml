name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      # Capacitor 8 requires Node 22+ and JDK 21.
      # Prefer repository secrets, but keep working defaults for the public
      # Supabase client configuration so the APK is usable without extra setup.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://bkawseezxnggrfwczvgs.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_18Fn9zbrDAV6YyXo5b1MSA_zw4MiVr5' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.3'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the action's legacy default (`tools platform-tools`);
          # the `tools` package was removed from modern Android SDKs.
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmdline-tools;latest"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          # Build the Capacitor variant (stubs the PWA service worker).
          CAPACITOR: '1'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.14.3 --distribution-type all

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
