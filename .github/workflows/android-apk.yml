name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Create .env file
        run: |
          echo "VITE_SUPABASE_URL=https://bkawseezxnggrfwczvgs.supabase.co" >> .env
          echo "VITE_SUPABASE_ANON_KEY=sb_publishable_18Fn9zbrDAV6YyXo5b1MSA_zw4MiVr5" >> .env

      - run: npm run cap:sync

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name artifact MySpace.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MySpace.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MySpace.apk
          path: MySpace.apk
